[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle_mcp"
version = "1.1.0"
description = "Model Context Protocol (MCP) server & OpenAPI bridge connecting AI assistants to Moodle LMS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "duck-5" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "moodle",
    "openapi",
    "claude",
    "anthropic",
    "ai-agents",
    "lms"
]
dependencies = [
    "mcp>=1.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.22.0",
    "pyyaml>=6.0",
    "google-genai>=1.0.0",
    "cryptography>=41.0.0"
]

[project.scripts]
moodle-mcp = "moodle_mcp.server:main"
moodle-mcp-openapi = "moodle_mcp.openapi_server:main"
moodle-mcp-gemini = "moodle_mcp.gemini_client:main"

[tool.setuptools]
package-dir = {"moodle_mcp" = "."}
packages = ["moodle_mcp", "moodle_mcp.tools"]

